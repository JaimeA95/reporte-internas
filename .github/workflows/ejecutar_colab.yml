name: Ejecutar notebook cada hora

on:
  schedule:
    - cron: '0 * * * *'  # Ejecuta cada hora
  workflow_dispatch:      # Permite ejecutarlo manualmente

jobs:
  run_notebook:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas gspread oauth2client gspread_dataframe openpyxl nbconvert

      - name: Ejecutar notebook
        run: |
          jupyter nbconvert --to notebook --execute reporte.ipynb --output reporte-output.ipynb
